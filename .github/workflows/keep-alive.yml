name: Keep Streamlit app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl -sSL -o /dev/null -w "HTTP %{http_code}\n" "https://sojinchoi-droid-waplat-dashboard-app-digoei.streamlit.app/"
